<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Character Encoding: Ensures special characters display correctly -->
    <meta charset="UTF-8">

    <!-- 2. Viewport: Essential for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. SEO Description: The summary shown in search engine results -->
    <meta name="description" content="A comprehensive guide to using meta tags in HTML for better SEO and social media presence.">

    <!-- 4. Keywords: Older SEO tag (mostly ignored by Google, but used by some internal search engines) -->
    <meta name="keywords" content="HTML, Meta Tags, Web Development, SEO">

    <!-- 5. Author: Identifies the creator of the page -->
    <meta name="author" content="Jane Doe">

    <!-- 6. Open Graph (OG) Tags: Controls how the page looks when shared on Facebook/LinkedIn -->
    <meta property="og:title" content="Mastering HTML Meta Tags">
    <meta property="og:description" content="Learn how to optimize your website with the right metadata.">
    <meta property="og:image" content="https://example.com/thumbnail.jpg">
    <meta property="og:url" content="https://example.com/meta-guide">

    <!-- 7. Twitter Card: Specifically for how the link appears on X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image">

    <title>Meta Tags Example</title>
</head>
<body>

    <h1>Understanding Meta Tags</h1>
    <p>Right-click this page and select <strong>"View Page Source"</strong> to see the meta tags in action within the head section.</p>

</body>
</html>
