<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Popup Boxes Demonstration</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            color: white;
        }
        .btn-alert { background-color: #e74c3c; }
        .btn-alert:hover { background-color: #c0392b; }
        
        .btn-confirm { background-color: #3498db; }
        .btn-confirm:hover { background-color: #2980b9; }
        
        .btn-prompt { background-color: #2ecc71; }
        .btn-prompt:hover { background-color: #27ae60; }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #ebebeb;
            border-radius: 5px;
            min-height: 20px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Popup Boxes Demo</h1>
        <p>Click the buttons below to test different popups:</p>
        
        <button class="btn btn-alert" onclick="showAlert()">Trigger Alert Box</button>
        <button class="btn btn-confirm" onclick="showConfirm()">Trigger Confirm Box</button>
        <button class="btn btn-prompt" onclick="showPrompt()">Trigger Prompt Box</button>

        <div id="result-box">Click a button to see the output here...</div>
    </div>

    <script>

        function showAlert() {
            alert("This is an Alert Box!\nIt just gives you information and waits for you to click OK.");
            
            let resultDisplay = document.getElementById("result-box");
            resultDisplay.innerHTML = "You acknowledged the Alert box.";
            resultDisplay.style.color = "#e74c3c";
        }

        function showConfirm() {
            let userChoice = confirm("This is a Confirm Box.\nClick 'OK' to agree or 'Cancel' to disagree.");
            
            let resultDisplay = document.getElementById("result-box");
            resultDisplay.style.color = "#3498db";
            
            if (userChoice === true) {
                resultDisplay.innerHTML = "You clicked: OK (True)";
            } else {
                resultDisplay.innerHTML = "You clicked: Cancel (False)";
            }
        }


        function showPrompt() {
            let userInput = prompt("This is a Prompt Box.\nPlease enter your name:", "Guest");
            
            let resultDisplay = document.getElementById("result-box");
            resultDisplay.style.color = "#2ecc71";
            
            if (userInput !== null) {
                if (userInput.trim() === "") {
                    resultDisplay.innerHTML = "You clicked OK but left the input empty!";
                } else {
                    resultDisplay.innerHTML = "Hello, " + userInput + "! Welcome to the site.";
                }
            } else {
                resultDisplay.innerHTML = "You cancelled the Prompt box.";
                resultDisplay.style.color = "#888";
            }
        }
    </script>
</body>
</html>
